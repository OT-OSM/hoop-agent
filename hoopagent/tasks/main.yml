
# === INSTALL CLI ===
- name: Install Hoop CLI
  ansible.builtin.shell: curl -s -L https://releases.hoop.dev/release/install-cli.sh | sh
  # args: creates REMOVED to ensure binary is present

- name: Configure Hoop CLI
  ansible.builtin.shell: |
    hoop config create --api-url {{ hoop_api_url }}
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"

- name: Set resource name variable
  ansible.builtin.set_fact:
    hoop_resource_name: "{{ hostvars[inventory_hostname].name }}"

# === CLEANUP (Best Effort) ===
- name: Stop and disable existing hoop-agent service
  ansible.builtin.systemd:
    name: hoop-agent.service
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Remove existing hoop-agent service file
  ansible.builtin.file:
    path: /etc/systemd/system/hoop-agent.service
    state: absent

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Remove existing Hoop connection (Control Plane)
  ansible.builtin.shell: |
    hoop admin remove connection {{ hoop_resource_name }}
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"
  ignore_errors: yes

- name: Remove existing Hoop agent (Control Plane)
  ansible.builtin.shell: |
    hoop admin remove agent {{ hoop_resource_name }}
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"
  ignore_errors: yes

- name: Remove old hoop config directory
  ansible.builtin.file:
    path: /home/opstree/.hoop
    state: absent

# === INSTALLATION & RECOVERY ===

- name: Create Hoop Agent
  ansible.builtin.shell: |
    hoop admin create agent {{ hoop_resource_name }}
  register: agent_create
  ignore_errors: yes
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"

- name: Debug agent creation output
  ansible.builtin.debug:
    var: agent_create.stdout_lines

# --- ROBUST KEY EXTRACTION (Regex Only - No jq) ---

- name: Extract grpc URL from NEW creation
  ansible.builtin.set_fact:
    # Regex looks for grpc:// followed by non-whitespace chars
    hoop_agent_url: "{{ agent_create.stdout | regex_search('grpc://[^\\s\"]+', '\\0') | default('') | first }}"
  when: agent_create.rc == 0 and agent_create.stdout is search('grpc://')

- name: Fetch raw agent details if ALREADY EXISTS
  ansible.builtin.shell: |
    hoop admin get agent {{ hoop_resource_name }}
  register: agent_existing_raw
  ignore_errors: yes
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"
  # Only run if we don't have the URL yet
  when: hoop_agent_url is not defined or hoop_agent_url == ''

- name: Extract grpc URL from existing agent output
  ansible.builtin.set_fact:
    # We search the raw output for the grpc:// pattern. 
    # This works even if the output is not valid JSON or has color codes.
    hoop_agent_url: "{{ agent_existing_raw.stdout | regex_search('grpc://[^\\s\"]+', '\\0') | default('') | first }}"
  when: 
    - hoop_agent_url is not defined or hoop_agent_url == ''
    - agent_existing_raw.rc == 0

# --- END EXTRACTION ---

- name: Ensure opstree owns hoop binary
  ansible.builtin.file:
    path: /usr/local/bin/hoop
    owner: opstree
    group: opstree
    mode: '0755'

- name: Create hoop config dir for opstree
  ansible.builtin.file:
    path: /home/opstree/.hoop
    state: directory
    owner: opstree
    group: opstree
    mode: '0755'

- name: Create systemd service with agent URL
  ansible.builtin.template:
    src: hoop-agent.service.j2
    dest: /etc/systemd/system/hoop-agent.service
  notify:
    - Reload systemd
    - Enable and start Hoop agent
  vars:
    HOOP_AGENT_URL: "{{ hoop_agent_url }}"
  # Only create service if we successfully found a URL
  when: hoop_agent_url is defined and hoop_agent_url != '' and 'failed' not in hoop_agent_url

- name: Create connection using agent URL
  ansible.builtin.shell: |
    hoop admin create connection {{ hoop_resource_name }} -a {{ hoop_resource_name }} -- bash
  args:
    executable: /bin/bash
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"
    HOOP_AGENT_URL: "{{ hoop_agent_url }}"
  ignore_errors: yes
  when: hoop_agent_url is defined and hoop_agent_url != ''
