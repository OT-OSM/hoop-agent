- name: Install jq (Debian/Ubuntu)
  ansible.builtin.apt:
    name: jq
    state: present
  when: ansible_os_family == "Debian"

- name: Install jq (RHEL/CentOS)
  ansible.builtin.yum:
    name: jq
    state: present
  when: ansible_os_family == "RedHat"

# === INSTALL CLI ===
- name: Install Hoop CLI
  ansible.builtin.shell: curl -s -L https://releases.hoop.dev/release/install-cli.sh | sh
  args:
    creates: /usr/local/bin/hoop

- name: Configure Hoop CLI
  ansible.builtin.shell: |
    hoop config create --api-url {{ hoop_api_url }}
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"

# === NORMALIZE RESOURCE NAME (LOWERCASE) ===
- name: Set normalized agent name (lowercase)
  ansible.builtin.set_fact:
    normalized_agent_name: "{{ hostvars[inventory_hostname].name | lower }}"

- name: Set resource name variable (for backward compatibility)
  ansible.builtin.set_fact:
    hoop_resource_name: "{{ normalized_agent_name }}"

# === AGGRESSIVE CLEANUP ===
- name: Remove existing Hoop connection (Attempt 1)
  ansible.builtin.shell: hoop admin delete connection {{ normalized_agent_name }}
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"
  ignore_errors: yes

- name: Remove existing Hoop agent (Attempt 1)
  ansible.builtin.shell: hoop admin delete agent {{ normalized_agent_name }}
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"
  ignore_errors: yes

- name: Wait for Hoop backend to process deletion
  ansible.builtin.pause:
    seconds: 10

# === INSTALLATION ===
- name: Create Hoop Agent (with retry)
  ansible.builtin.shell: |
    hoop admin create agent {{ normalized_agent_name }}
  register: agent_create
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"
  retries: 3
  delay: 5
  until: agent_create.rc == 0
  ignore_errors: yes

- name: Debug agent creation output
  ansible.builtin.debug:
    var: agent_create.stdout_lines

# --- EXTRACTION STRATEGY ---
- name: Extract full agent URL (simple approach)
  ansible.builtin.set_fact:
    hoop_agent_url: "{{ agent_create.stdout_lines[0] | default('') | trim }}"
  when: agent_create.stdout_lines | length > 0

# Fallback: Extract grpc URL using regex
- name: Extract grpc URL from NEW creation (regex fallback)
  ansible.builtin.set_fact:
    hoop_agent_url: "{{ agent_create.stdout | regex_search('grpc://[^\\s\"]+', '\\0') | default('') | first }}"
  when: 
    - hoop_agent_url is not defined or hoop_agent_url == ''
    - agent_create.rc == 0 
    - agent_create.stdout is search('grpc://')

# Final fallback: Fetch from agent list
- name: Fetch grpc URL from agent list (Fallback)
  ansible.builtin.shell: |
    hoop admin get agents -o json | jq -r '.[] | select(.name == "{{ normalized_agent_name }}") | .key // .url // empty'
  register: agent_existing_list
  ignore_errors: yes
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"
  when: hoop_agent_url is not defined or hoop_agent_url == ''

- name: Set URL from fallback list
  ansible.builtin.set_fact:
    hoop_agent_url: "{{ agent_existing_list.stdout | trim }}"
  when: 
    - hoop_agent_url is not defined or hoop_agent_url == ''
    - agent_existing_list.rc == 0
    - agent_existing_list.stdout != ""

# --- END EXTRACTION ---

- name: Ensure opstree owns hoop binary
  ansible.builtin.file:
    path: /usr/local/bin/hoop
    owner: opstree
    group: opstree
    mode: '0755'

- name: Create hoop config dir for opstree
  ansible.builtin.file:
    path: "/home/opstree/.hoop"
    state: directory
    owner: opstree
    group: opstree
    mode: '0755'

- name: Create systemd service with agent URL
  ansible.builtin.template:
    src: hoop-agent.service.j2
    dest: "/etc/systemd/system/hoop-agent.service"
  notify:
    - Reload systemd
    - Enable and start Hoop agent
  vars:
    HOOP_AGENT_URL: "{{ hoop_agent_url }}"
  when: hoop_agent_url is defined and hoop_agent_url != '' and 'failed' not in hoop_agent_url

- name: Create connection using agent URL
  ansible.builtin.shell: |
    hoop admin create connection {{ normalized_agent_name }} -a {{ normalized_agent_name }} -- bash
  args:
    executable: /bin/bash
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"
    HOOP_AGENT_URL: "{{ hoop_agent_url }}"
  ignore_errors: yes
  when: hoop_agent_url is defined and hoop_agent_url != ''
