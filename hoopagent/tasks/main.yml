- name: Install Hoop CLI
  ansible.builtin.shell: curl -s -L https://releases.hoop.dev/release/install-cli.sh | sh
  #args:
  #  creates: /usr/local/bin/hoop

- name: Configure Hoop CLI
  ansible.builtin.shell: |
    hoop config create --api-url {{ hoop_api_url }}
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"

- name: Set resource name variable
  # THIS TASK WAS MISSING FROM YOUR PASTE
  ansible.builtin.set_fact:
    hoop_resource_name: "{{ hostvars[inventory_hostname].name }}"


# === CLEANUP PREVIOUS INSTALLATION ===
- name: Stop and disable existing hoop-agent service
  ansible.builtin.systemd:
    name: hoop-agent.service
    state: stopped
    enabled: no
  ignore_errors: yes # Ignore if the service doesn't exist

- name: Remove existing hoop-agent service file
  ansible.builtin.file:
    path: /etc/systemd/system/hoop-agent.service
    state: absent

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Remove existing Hoop connection (from control plane)
  ansible.builtin.shell: |
    hoop admin remove connection {{ hoop_resource_name }}
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"
  ignore_errors: yes # Ignore if connection doesn't exist

- name: Remove existing Hoop agent (from control plane)
  ansible.builtin.shell: |
    hoop admin remove agent {{ hoop_resource_name }}
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"
  ignore_errors: yes # Ignore if agent doesn't exist

- name: Remove old hoop config directory for opstree
  ansible.builtin.file:
    path: /home/opstree/.hoop
    state: absent

- name: Create Hoop Agent
  ansible.builtin.shell: |
    hoop admin create agent {{ hostvars[inventory_hostname].name }}
  register: agent_create
  ignore_errors: yes
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"

- name: Debug agent creation output
  ansible.builtin.debug:
    var: agent_create.stdout_lines

- name: Extract full agent URL
  ansible.builtin.set_fact:
    hoop_agent_url: "{{ agent_create.stdout_lines[0] }}"
  when: agent_create.stdout_lines | length > 0

- name: Ensure opstree owns hoop binary
  ansible.builtin.file:
    path: /usr/local/bin/hoop
    owner: opstree
    group: opstree
    mode: '0755'

- name: Create hoop config dir for opstree
  ansible.builtin.file:
    path: /home/opstree/.hoop
    state: directory
    owner: opstree
    group: opstree
    mode: '0755'

- name: Create systemd service with agent URL
  ansible.builtin.template:
    src: hoop-agent.service.j2
    dest: /etc/systemd/system/hoop-agent.service
  notify:
    - Reload systemd
    - Enable and start Hoop agent
  vars:
    HOOP_AGENT_URL: "{{ hoop_agent_url }}"
  when: hoop_agent_url is defined and hoop_agent_url != ''

- name: Create connection using agent URL
  ansible.builtin.shell: |
    hoop admin create connection {{ hostvars[inventory_hostname].name }} -a {{ hostvars[inventory_hostname].name }} -- bash
  args:
    executable: /bin/bash
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"
    HOOP_AGENT_URL: "{{ hoop_agent_url }}"
  when: hoop_agent_url is defined and hoop_agent_url != ''
