
# === PRE-REQUISITES ===
- name: Install jq (Debian/Ubuntu)
  ansible.builtin.apt:
    name: jq
    state: present
  when: ansible_os_family == "Debian"

- name: Install jq (RHEL/CentOS)
  ansible.builtin.yum:
    name: jq
    state: present
  when: ansible_os_family == "RedHat"

# === INSTALL CLI ===
- name: Install Hoop CLI
  ansible.builtin.shell: curl -s -L https://releases.hoop.dev/release/install-cli.sh | sh

- name: Configure Hoop CLI
  ansible.builtin.shell: |
    hoop config create --api-url {{ hoop_api_url }}
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"

- name: Set resource name variable
  ansible.builtin.set_fact:
    hoop_resource_name: "{{ hostvars[inventory_hostname].name }}"

# === AGGRESSIVE CLEANUP ===
# We run this twice and wait, to ensure the backend releases the name.

- name: Remove existing Hoop connection (Attempt 1)
  ansible.builtin.shell: hoop admin delete connection {{ hoop_resource_name }}
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"
  ignore_errors: yes

- name: Remove existing Hoop agent (Attempt 1)
  ansible.builtin.shell: hoop admin delete agent {{ hoop_resource_name }}
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"
  ignore_errors: yes

- name: Wait for Hoop backend to process deletion
  ansible.builtin.pause:
    seconds: 10
  # Giving the API time to release the resource name

# === INSTALLATION ===

- name: Create Hoop Agent (with retry)
  ansible.builtin.shell: |
    hoop admin create agent {{ hoop_resource_name }}
  register: agent_create
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"
  # If it fails (409), we wait 5s and try again, up to 3 times
  retries: 3
  delay: 5
  until: agent_create.rc == 0
  ignore_errors: yes

- name: Debug agent creation output
  ansible.builtin.debug:
    var: agent_create.stdout_lines

# --- EXTRACTION STRATEGY ---

- name: Extract grpc URL from NEW creation
  ansible.builtin.set_fact:
    hoop_agent_url: "{{ agent_create.stdout | regex_search('grpc://[^\\s\"]+', '\\0') | default('') | first }}"
  when: agent_create.rc == 0 and agent_create.stdout is search('grpc://')

# Fallback: If create still failed, we try to fetch from the LIST of agents
# We use 'get agents' (plural) and filter with jq
- name: Fetch grpc URL from agent list (Fallback)
  ansible.builtin.shell: |
    hoop admin get agents -o json | jq -r '.items[]? | select(.name == "{{ hoop_resource_name }}") | .key // .url // empty'
  register: agent_existing_list
  ignore_errors: yes
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"
  when: hoop_agent_url is not defined or hoop_agent_url == ''

- name: Set URL from fallback list
  ansible.builtin.set_fact:
    hoop_agent_url: "{{ agent_existing_list.stdout | trim }}"
  when: 
    - hoop_agent_url is not defined or hoop_agent_url == ''
    - agent_existing_list.rc == 0
    - agent_existing_list.stdout != ""

# --- END EXTRACTION ---

- name: Ensure opstree owns hoop binary
  ansible.builtin.file:
    path: /usr/local/bin/hoop
    owner: opstree
    group: opstree
    mode: '0755'

- name: Create hoop config dir for opstree
  ansible.builtin.file:
    path: /home/opstree/.hoop
    state: directory
    owner: opstree
    group: opstree
    mode: '0755'

- name: Create systemd service with agent URL
  ansible.builtin.template:
    src: hoop-agent.service.j2
    dest: /etc/systemd/system/hoop-agent.service
  notify:
    - Reload systemd
    - Enable and start Hoop agent
  vars:
    HOOP_AGENT_URL: "{{ hoop_agent_url }}"
  when: hoop_agent_url is defined and hoop_agent_url != '' and 'failed' not in hoop_agent_url

- name: Create connection using agent URL
  ansible.builtin.shell: |
    hoop admin create connection {{ hoop_resource_name }} -a {{ hoop_resource_name }} -- bash
  args:
    executable: /bin/bash
  environment:
    HOOP_TOKEN: "{{ hoop_token }}"
    HOOP_AGENT_URL: "{{ hoop_agent_url }}"
  ignore_errors: yes
  when: hoop_agent_url is defined and hoop_agent_url != ''
